layout: compress
---
<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}"/>
  <meta name="keywords" content="{{ site.keywords }}"/>
  <meta name="author" content="{{ site.author }}"/>
  <link rel="shortcut icon" href="{{ '/assets/images/Amoolya.JPG' | relative_url }}"/>
  <link rel="stylesheet" href="{{ '/css/normalize.css' | relative_url }}"/>
  <link rel="stylesheet" href="{{ '/fonts/font-awesome/css/font-awesome.css' | relative_url }}"/>
  <link rel="stylesheet" href="{{ '/css/modern-blog.css' | relative_url }}"/>
  <link rel="stylesheet" href="{{ '/assets/css/main.css?v=20260309s' | relative_url }}"/>
</head>
<body class="body">
<div class="container">
  <header class="header">
    <h1>{{ site.title }}<span>{{ site.description }}</span></h1>
    <nav class="links">
      <a href="{{ '/about/' | relative_url }}"><i class="fa fa-user fa-2x"></i></a>
      <a href="{{ '/cv/' | relative_url }}"><i class="fa fa-file-text fa-2x"></i></a>
      <a href="{{ '/projects/' | relative_url }}"><i class="fa fa-flask fa-2x"></i></a>
      <a href="{{ '/publications/' | relative_url }}"><i class="fa fa-book fa-2x"></i></a>
      <a href="{{ '/tags/' | relative_url }}"><i class="fa fa-tags fa-2x"></i></a>
    </nav>
    <div class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
    </div>
  </header>

  <div class="content">
    <div class="pattern pattern--hidden"></div>
    <div class="page-shell">
      {{ content }}
    </div>
    <div class="dna-footer-banner" aria-hidden="true"></div>
  </div>
</div>
<script src="{{ '/js/vendors/trianglify.min.js' | relative_url }}"></script>
<script src="{{ '/js/vendors/cash.min.js' | relative_url }}"></script>
<script src="{{ '/js/modern-blog.js' | relative_url }}"></script>
<script>
  (function () {
    var selectors = ".quick-links a, .site-nav a, .links a, .project-card-link";
    document.addEventListener("click", function (event) {
      var el = event.target.closest(selectors);
      if (!el) return;
      el.classList.remove("click-pop");
      void el.offsetWidth;
      el.classList.add("click-pop");
      setTimeout(function () {
        el.classList.remove("click-pop");
      }, 320);
    });
  })();

  (function () {
    var scrollEl = document.getElementById("photo-frolics-scroll");
    if (!scrollEl) return;

    var leftBtn = document.querySelector(".frolics-nav-left");
    var rightBtn = document.querySelector(".frolics-nav-right");
    var step = 420;

    if (leftBtn) {
      leftBtn.addEventListener("click", function () {
        scrollEl.scrollBy({ left: -step, behavior: "smooth" });
      });
    }

    if (rightBtn) {
      rightBtn.addEventListener("click", function () {
        scrollEl.scrollBy({ left: step, behavior: "smooth" });
      });
    }

    var zoomPanel = document.getElementById("photo-zoom-panel");
    var zoomImage = document.getElementById("photo-zoom-image");
    if (!zoomPanel || !zoomImage) return;

    var photos = Array.prototype.slice.call(scrollEl.querySelectorAll(".frolics-photo"));
    var currentIndex = -1;

    function resolvePhotoSrc(photoEl) {
      if (!photoEl) return "";
      return photoEl.getAttribute("data-full") || photoEl.getAttribute("src") || photoEl.currentSrc || photoEl.src || "";
    }

    function showPhoto(index) {
      if (!photos.length) return;
      currentIndex = (index + photos.length) % photos.length;
      var active = photos[currentIndex];
      var src = resolvePhotoSrc(active);
      if (!src) return;
      zoomImage.src = src;
      zoomImage.alt = active.alt || "Selected photo";
      zoomPanel.classList.add("open");
      zoomPanel.setAttribute("aria-hidden", "false");
    }

    zoomImage.addEventListener("error", function () {
      var active = photos[currentIndex];
      if (!active) return;
      var fallback = active.getAttribute("src") || active.currentSrc || active.src || "";
      if (fallback && zoomImage.src !== fallback) zoomImage.src = fallback;
    });

    scrollEl.addEventListener("click", function (event) {
      var img = event.target.closest(".frolics-photo");
      if (!img) return;
      showPhoto(photos.indexOf(img));
      zoomPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    function showNext() {
      if (currentIndex < 0) return;
      showPhoto(currentIndex + 1);
    }

    function showPrev() {
      if (currentIndex < 0) return;
      showPhoto(currentIndex - 1);
    }

    document.addEventListener("keydown", function (event) {
      if (currentIndex < 0) return;
      if (event.key === "ArrowRight") showNext();
      if (event.key === "ArrowLeft") showPrev();
    });
  })();
</script>
</body>
</html>
